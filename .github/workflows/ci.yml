name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository source code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 environment with npm caching enabled
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install project dependencies using package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint to verify code quality and style
      - name: Run linter
        run: npm run lint

      # Step 5: Execute test suite in CI mode with Jest
      - name: Run tests
        run: npm test -- --ci

      # Step 6: Build the production bundle with the weather API key secret
      - name: Build application
        env:
          VITE_WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: npm run build

      # Step 7: Upload the built dist folder as a workflow artifact named "dist"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Step 1: Download the production dist artifact from the build-test job
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Step 2: Upload dist directory as a GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Step 3: Deploy the Pages artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
